<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<title>Audit Log — E-Voting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#0d1117; color:#c9d1d9; }
  .navbar { background:#161b22 !important; border-bottom:1px solid #30363d; }
  .card { background:#161b22; border:1px solid #30363d; }
  .timeline { border-left:2px solid #30363d; padding-left:1rem; }
  .timeline-item { position:relative; padding-bottom:1rem; }
  .timeline-item::before { content:''; position:absolute; left:-1.4rem; top:0.25rem; width:10px; height:10px; border-radius:50%; background:#58a6ff; }
  .mono { font-family:"JetBrains Mono", monospace; font-size:0.78rem; }
  th.sortable { cursor:pointer; user-select:none; }
</style>
</head>
<body>

<nav class="navbar navbar-dark px-3">
  <span class="navbar-brand mb-0 h1">📜 Audit Log</span>
  <a href="/admin.html" class="btn btn-outline-light btn-sm">← Kembali ke Admin Panel</a>
</nav>

<div class="container py-4">

  <div class="card mb-3 p-3">
    <div class="row g-2">
      <div class="col-md-3">
        <label class="form-label small">Cari (username/aksi/IP)</label>
        <input id="fSearch" type="text" class="form-control" placeholder="ketik lalu Enter...">
      </div>
      <div class="col-md-2">
        <label class="form-label small">Aksi</label>
        <select id="fAction" class="form-select"><option value="">Semua</option></select>
      </div>
      <div class="col-md-2">
        <label class="form-label small">Dari Tanggal</label>
        <input id="fFrom" type="date" class="form-control">
      </div>
      <div class="col-md-2">
        <label class="form-label small">Sampai Tanggal</label>
        <input id="fTo" type="date" class="form-control">
      </div>
      <div class="col-md-3 d-flex align-items-end gap-2">
        <button class="btn btn-primary" onclick="reloadLogs()">Terapkan</button>
        <button class="btn btn-outline-light" onclick="resetFilters()">Reset</button>
      </div>
    </div>
    <div class="mt-3 d-flex gap-2">
      <a id="btnExportPdf" class="btn btn-outline-danger btn-sm" href="#">⬇ Export PDF</a>
      <a id="btnExportExcel" class="btn btn-outline-success btn-sm" href="#">⬇ Export Excel</a>
      <span class="ms-auto small text-muted align-self-center" id="totalInfo"></span>
    </div>
  </div>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" id="tabTableBtn" onclick="switchView('table')">Tabel</button></li>
    <li class="nav-item"><button class="nav-link" id="tabTimelineBtn" onclick="switchView('timeline')">Timeline</button></li>
  </ul>

  <div id="viewTable" class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead>
          <tr>
            <th class="sortable" data-col="timestamp">Waktu ⇅</th>
            <th class="sortable" data-col="username">Username ⇅</th>
            <th class="sortable" data-col="action">Aksi ⇅</th>
            <th class="sortable" data-col="ip_address">IP ⇅</th>
            <th>Block Ledger</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="5" class="text-center text-muted py-4">Memuat...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="viewTimeline" class="card p-3" style="display:none">
    <div class="timeline" id="timelineContainer"></div>
  </div>

  <div class="d-flex justify-content-between mt-3">
    <button class="btn btn-outline-light btn-sm" onclick="prevPage()">← Sebelumnya</button>
    <span class="small text-muted align-self-center" id="pageInfo"></span>
    <button class="btn btn-outline-light btn-sm" onclick="nextPage()">Berikutnya →</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="audit-log.js"></script>
</body>
</html>
