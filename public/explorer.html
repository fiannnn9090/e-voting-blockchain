<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<title>Blockchain Explorer — E-Voting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#0d1117; color:#c9d1d9; font-family: -apple-system, sans-serif; }
  .navbar { background:#161b22 !important; border-bottom:1px solid #30363d; }
  .card { background:#161b22; border:1px solid #30363d; }
  .table { color:#c9d1d9; }
  .table > :not(caption) > * > * { background:#161b22; border-color:#30363d; }
  .hash-mono { font-family: "JetBrains Mono", monospace; font-size:0.8rem; word-break:break-all; }
  .badge-ledger { font-size:0.75rem; }
  .modal-content { background:#161b22; color:#c9d1d9; border:1px solid #30363d; }
  tr.block-row { cursor:pointer; }
  tr.block-row:hover { background:#1c2330; }
  .field-label { color:#8b949e; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em; }
</style>
</head>
<body>

<nav class="navbar navbar-dark px-3">
  <span class="navbar-brand mb-0 h1">🔗 Blockchain Explorer</span>
  <a href="/admin.html" class="btn btn-outline-light btn-sm">← Kembali ke Admin Panel</a>
</nav>

<div class="container py-4">

  <div class="card mb-4 p-3">
    <div class="row g-3 align-items-end">
      <div class="col-auto">
        <label class="form-label field-label">Ledger</label>
        <select id="ledgerSelect" class="form-select">
          <option value="vote">Vote Ledger</option>
          <option value="candidate">Candidate Ledger</option>
          <option value="audit">Audit Ledger</option>
        </select>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" onclick="loadBlockList()">↺ Muat Ulang</button>
      </div>
      <div class="col-auto ms-auto">
        <span id="chainStatus" class="badge bg-secondary">Memuat status...</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead>
          <tr>
            <th>#Index</th>
            <th>Timestamp</th>
            <th>Jumlah Transaksi</th>
            <th>Hash</th>
            <th>Previous Hash</th>
          </tr>
        </thead>
        <tbody id="blockTableBody">
          <tr><td colspan="5" class="text-center text-muted py-4">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Modal Detail Block -->
<div class="modal fade" id="blockDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-secondary">
        <h5 class="modal-title" id="modalBlockTitle">Detail Block</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalBlockBody">
        Memuat...
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="explorer.js"></script>
</body>
</html>
