<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<title>E-Voting — BEM Kampus</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { background:#0d1117; color:#c9d1d9; }
  .navbar { background:#161b22 !important; border-bottom:1px solid #30363d; }
  .card { background:#161b22; border:1px solid #30363d; }
  .mono { font-family:"JetBrains Mono", monospace; font-size:0.8rem; word-break:break-all; }
  #loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:2.5rem; width:100%; max-width:380px; }
  .candidate-card { transition:transform .15s; }
  .candidate-card:hover { transform:translateY(-3px); }
  #toast { position:fixed; top:1rem; right:1rem; z-index:2000; }
  #toast.show { display:block; }
  #toast:not(.show) { display:none; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:1500; }
  .modal-overlay.show { display:flex; }

  /* Class lama yang masih di-generate script.js (kandidat/hasil/block) --
     diberi styling di sini supaya konsisten dengan tema Bootstrap dark baru,
     tanpa perlu mengubah script.js sama sekali. */
  #voteContainer, #results, #blocks { display:flex; flex-wrap:wrap; gap:1rem; }
  .card-number { font-family:"JetBrains Mono",monospace; font-size:0.8rem; color:#8b949e; margin-bottom:0.5rem; }
  .result-card, .block { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1rem; flex:1 1 260px; }
  .hash-value { font-family:"JetBrains Mono",monospace; font-size:0.75rem; word-break:break-all; color:#8b949e; }
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="login-card">
    <h4 class="mb-1">⬡ E-Voting System</h4>
    <p class="text-muted small mb-4">Masukkan NIM dan password yang diberikan panitia.</p>
    <div class="mb-3"><label class="form-label small">NIM</label><input type="text" id="nim" class="form-control" placeholder="5 digit akhir NIM"></div>
    <div class="mb-3"><label class="form-label small">PASSWORD</label><input type="password" id="password" class="form-control" placeholder="••••••"></div>
    <button class="btn btn-primary w-100" onclick="login()">Masuk →</button>
  </div>
</div>

<!-- ── DASHBOARD VOTING ── -->
<div id="votingArea" style="display:none;">

  <nav class="navbar navbar-dark px-3">
    <span class="navbar-brand mb-0 h1">⬡ E-VOTING</span>
    <div class="d-flex align-items-center gap-3">
      <span id="status" class="badge bg-secondary"></span>
      <span class="text-muted small" id="userInfo"></span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Keluar</button>
    </div>
  </nav>

  <div class="container py-4">

    <div class="text-end mb-3">
      <button class="btn btn-outline-danger btn-sm" onclick="hackBlockchain()">☠ Demo: Hack Blockchain</button>
    </div>

    <h5 class="mb-3">◈ Pilih Kandidat</h5>
    <div class="row g-3 mb-5" id="voteContainer"></div>

    <h5 class="mb-3">◈ Hasil Voting</h5>
    <div class="row g-3 mb-3" id="results"></div>
    <div class="card p-3 mb-5">
      <canvas id="voteChart" height="90"></canvas>
    </div>

    <h5 class="mb-3">◈ Blockchain Explorer</h5>
    <div id="blocks" class="row g-3"></div>

  </div>
</div>

<div id="toast"></div>

<!-- ── Konfirmasi Vote Berhasil ── -->
<div id="confirmOverlay" class="modal-overlay">
  <div class="card p-4" style="max-width:420px; width:100%;">
    <div class="text-center display-6 mb-2">✅</div>
    <h4 class="text-center mb-3">Vote Berhasil Dicatat!</h4>
    <p class="text-center text-muted mb-3" id="confirmName"></p>
    <div class="mono mb-1"><strong>Pemilih:</strong> <span id="confirmNim"></span></div>
    <div class="mono mb-1"><strong>Kandidat:</strong> <span id="confirmCandidate"></span></div>
    <div class="mono mb-3"><strong>Waktu:</strong> <span id="confirmTime"></span></div>
    <p class="text-muted small text-center">Simpan tangkapan layar ini sebagai bukti voting.</p>
    <button class="btn btn-primary w-100 mt-2" onclick="tutupKonfirmasi()">OK, Selesai →</button>
  </div>
</div>

<!-- ── Custom Confirm Dialog ── -->
<div id="customConfirmOverlay" class="modal-overlay">
  <div class="card p-4" style="max-width:380px; width:100%;">
    <div class="text-center display-6 mb-2" id="customConfirmIcon">⚠️</div>
    <h5 class="text-center" id="customConfirmTitle">Konfirmasi</h5>
    <p class="text-center text-muted" id="customConfirmMessage"></p>
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-outline-light flex-fill" id="customConfirmCancelBtn">Batal</button>
      <button class="btn btn-danger flex-fill" id="customConfirmOkBtn">Ya, Lanjutkan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
</body>
</html>
